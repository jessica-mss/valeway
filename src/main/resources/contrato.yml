openapi: 3.0.3
info:
  title: OpenAPI definition
  version: v0
servers:
  - url: http://localhost:8080
    description: Generated server url
paths:
  /api/employees/{id}:
    get:
      tags:
        - employee
      operationId: get
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EmployeeResponseDTO"
    put:
      tags:
        - employee
      operationId: update
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeRequestDTO"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EmployeeResponseDTO"
    delete:
      tags:
        - employee
      operationId: delete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
  /api/companies/{id}:
    get:
      tags:
        - company
      operationId: buscar
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CompanyResponseDTO"
    put:
      tags:
        - company
      operationId: atualizar
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyRequestDTO"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CompanyResponseDTO"
    delete:
      tags:
        - company
      operationId: deletar
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
  /api/roteirizacao/solicitacao:
    post:
      tags:
        - roteirizacao
      operationId: solicitarRoteirizacao
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoordenadasRoteirizacaoRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoteirizacaoRepresentation"
  /api/employees:
    get:
      tags:
        - employee
      operationId: getAll
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeResponseDTO"
    post:
      tags:
        - employee
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeRequestDTO"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EmployeeResponseDTO"
  /api/companies:
    get:
      tags:
        - company
      operationId: listar
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompanyResponseDTO"
    post:
      tags:
        - company
      operationId: criar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyRequestDTO"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CompanyResponseDTO"
  /api/companies/{id}/employees:
    get:
      tags:
        - company
      operationId: getEmpresaComFuncionarios
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EmployeesByCompanyDTO"
components:
  schemas:
    EmployeeRequestDTO:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        cpf:
          type: string
          minLength: 1
        salary:
          type: number
        address:
          type: string
          minLength: 1
        registration:
          type: string
          minLength: 1
        companyId:
          type: integer
          format: int64
      required:
        - address
        - companyId
        - cpf
        - name
        - registration
        - salary
    EmployeeResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        cpf:
          type: string
        salary:
          type: number
        address:
          type: string
        registration:
          type: string
        companyCnpj:
          type: string
    CompanyRequestDTO:
      type: object
      properties:
        companyName:
          type: string
          minLength: 1
        cnpj:
          type: string
          minLength: 1
        address:
          type: string
          minLength: 1
        contactEmail:
          type: string
          format: email
          minLength: 1
        contactPhone:
          type: string
          minLength: 1
        contactPersonName:
          type: string
          minLength: 1
        status:
          type: string
          minLength: 1
      required:
        - address
        - cnpj
        - companyName
        - contactEmaila
        - contactPersonName
        - contactPhone
        - status
    CompanyResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        companyName:
          type: string
        cnpj:
          type: string
        address:
          type: string
        contactEmail:
          type: string
        contactPhone:
          type: string
        contactPersonName:
          type: string
        status:
          type: string
    CoordenadasRoteirizacaoRequest:
      type: object
      properties:
        enderecoOrigem:
          type: string
        enderecoDestino:
          type: string
    RoteirizacaoDetalhadaRepresentation:
      type: object
      properties:
        sentido:
          type: string
        origem:
          type: string
        percurso:
          type: array
          items:
            $ref: "#/components/schemas/StepRepresentation"
        destino:
          type: string
        valor:
          type: number
    RoteirizacaoRepresentation:
      type: object
      properties:
        detalhesRoteirizacao:
          type: array
          items:
            $ref: "#/components/schemas/RoteirizacaoDetalhadaRepresentation"
    StepRepresentation:
      type: object
      properties:
        embarque:
          type: string
        transporte:
          $ref: "#/components/schemas/TransporteRepresentation"
        desembarque:
          type: string
        travel_mode:
          type: string
    TransporteRepresentation:
      type: object
      properties:
        nome:
          type: string
        codigo:
          type: string
        tipo:
          type: string
    EmployeesByCompanyDTO:
      type: object
      properties:
        companyId:
          type: integer
          format: int64
        companyName:
          type: string
        cnpj:
          type: string
        funcionarios:
          type: array
          items:
            $ref: "#/components/schemas/EmployeeResponseDTO"
